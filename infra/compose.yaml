name: verisource-core002

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: verisource
      POSTGRES_USER: verisource
      POSTGRES_PASSWORD: ${VERISOURCE_POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:${VERISOURCE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verisource -d verisource"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
