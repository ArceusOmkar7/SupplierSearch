[project]
name = "verisource"
version = "0.1.0"
description = "Local supplier verification with attributable evidence and private cases"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.15,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "pwdlib[argon2]>=0.2,<1",
    "httpx>=0.28,<1",
    "playwright>=1.51,<2",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=4.30,<6",
    "pytesseract>=0.3,<1",
    "openpyxl>=3.1,<4",
    "reportlab>=4.3,<5",
    "python-multipart>=0.0.20,<1",
    "beautifulsoup4>=4.13,<5",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
gemini-free = ["google-genai>=1,<2"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verisource"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["pypdfium2", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a disposable PostgreSQL database",
    "real_records: requires genuine records with verified provenance",
    "live: performs permitted live source retrieval",
]
